server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~* \.(css|js|svg|webp|woff2)$ { expires 7d; }
    # The APK itself lives on GitHub Releases; this keeps a stable short link.
    location = /sofa.apk { return 302 https://github.com/andreconde21/sofa-remote/releases/latest/download/sofa.apk; }
}
